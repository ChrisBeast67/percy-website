<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dragon Memory - Percy's World</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: linear-gradient(135deg, #2b1a3d, #1a1a2e, #3d1a2b); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 10px; font-family: 'Courier New', monospace; }
        .console { background: linear-gradient(160deg, #FFC247, #ff8c1a); border-radius: 25px; padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 -5px 20px rgba(0,0,0,0.25); max-width: 420px; width: 100%; }
        .title { text-align: center; color: #3b2410; font-size: 13px; font-weight: bold; margin-bottom: 8px; letter-spacing: 1px; }
        .screen-border { background: #1a1a2e; border-radius: 10px; padding: 8px; margin-bottom: 10px; }
        .info-bar { display: flex; justify-content: space-between; font-size: 11px; color: #4dd0ff; margin-bottom: 6px; }
        .board { display: grid; gap: 6px; justify-content: center; }
        .tile { width: 100%; aspect-ratio: 1/1; min-height: 46px; border-radius: 8px; border: 2px solid #4dd0ff; background: #0d0b14; color: transparent; font-size: 30px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .12s, background .12s; user-select: none; }
        .tile:hover { background: #221c30; }
        .tile.flipped { background: #fff3d6; border-color: #ff8c1a; }
        .tile.matched { background: #2f7d4f; border-color: #50dc78; cursor: default; }
        .tile.wrong { background: #7d2f2f; border-color: #ff5050; }
        .controls { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
        .btn { border: none; border-radius: 6px; padding: 8px 12px; font-family: 'Courier New', monospace; font-size: 11px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
        .btn.green { background: #00c853; color: #003b12; }
        .btn.red { background: #ff5252; color: #4a0000; }
        .btn.gold { background: #FFC247; color: #3b2410; }
        .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.3); }
        .msg { text-align: center; color: #fff3d6; font-size: 12px; margin-top: 8px; min-height: 16px; }
        a { color: #FFC247; margin-top: 10px; display: block; text-align: center; font-size: 12px; }
    </style>
</head>
<body>
    <div class="console">
        <div class="title">DRAGON MEMORY</div>
        <div class="screen-border">
            <div class="info-bar">
                <span>MOVES: <b id="moves">0</b></span>
                <span>TIME: <b id="time">0</b>s</span>
                <span>PAIRS: <b id="pairs">0</b></span>
            </div>
            <div class="board" id="board"></div>
        </div>
        <div class="controls">
            <button class="btn green" id="startBtn">▶ NEW GAME</button>
            <button class="btn gold" id="easyBtn">EASY 4×4</button>
            <button class="btn red" id="hardBtn">HARD 4×5</button>
        </div>
        <div class="msg" id="msg">Flip two tiles to find a matching pair of dragons!</div>
    </div>
    <a href="../games.html">← Back</a>
    <script>
        const FACES = ['🐉','🐲','🦅','🦇','🐢','🦂','🦎','🐍','🦖','🐊','🦋','🐝'];
        const boardEl = document.getElementById('board');
        let cards = [], first = null, lock = false, moves = 0, pairsFound = 0, timer = null, seconds = 0, cols = 4;

        function build(colsN) {
            cols = colsN;
            const total = cols * (cols === 4 ? 4 : 5);
            const picks = FACES.slice(0, total / 2);
            cards = picks.concat(picks).sort(() => Math.random() - 0.5);
            boardEl.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
            boardEl.innerHTML = '';
            cards.forEach((face, i) => {
                const t = document.createElement('div');
                t.className = 'tile';
                t.textContent = face;
                t.dataset.face = face;
                t.dataset.index = i;
                t.addEventListener('click', () => flip(t));
                boardEl.appendChild(t);
            });
            moves = 0; pairsFound = 0; seconds = 0; first = null; lock = false;
            document.getElementById('moves').textContent = '0';
            document.getElementById('pairs').textContent = '0';
            document.getElementById('time').textContent = '0';
            clearInterval(timer);
            timer = setInterval(() => { seconds++; document.getElementById('time').textContent = seconds; }, 1000);
            setMsg('Go! Find all the pairs.');
        }

        function flip(tile) {
            if (lock) return;
            if (tile.classList.contains('flipped') || tile.classList.contains('matched')) return;
            tile.classList.add('flipped');
            if (!first) { first = tile; return; }
            moves++;
            document.getElementById('moves').textContent = moves;
            if (first.dataset.face === tile.dataset.face) {
                first.classList.add('matched');
                tile.classList.add('matched');
                first = null;
                pairsFound++;
                document.getElementById('pairs').textContent = pairsFound;
                if (pairsFound === cards.length / 2) win();
            } else {
                lock = true;
                const a = first;
                first = null;
                tile.classList.add('wrong');
                a.classList.add('wrong');
                setTimeout(() => {
                    tile.classList.remove('flipped', 'wrong');
                    a.classList.remove('flipped', 'wrong');
                    lock = false;
                }, 700);
            }
        }

        function win() {
            clearInterval(timer);
            const best = moves <= cards.length / 2 ? 'FLAWLESS!' : (moves <= cards.length * 0.8 ? 'NICE!' : 'DONE!');
            setMsg('🏆 ' + best + ' You cleared the lair in ' + moves + ' moves and ' + seconds + 's!');
        }

        function setMsg(t) { document.getElementById('msg').textContent = t; }

        document.getElementById('startBtn').onclick = () => build(cols);
        document.getElementById('easyBtn').onclick = () => build(4);
        document.getElementById('hardBtn').onclick = () => build(5);
        build(4);
    </script>
</body>
</html>
